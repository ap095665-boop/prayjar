<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prayer Jar Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#111;color:#fff;font-family:Arial}.container{max-width:900px;margin:auto;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.item{background:#222;border-radius:10px;padding:15px}button{padding:10px;border:none;border-radius:8px;cursor:pointer}.approve{background:#2ecc71}.reject{background:#e74c3c;color:#fff}.refresh{background:#d4af37}textarea{width:100%;height:70px;margin-top:10px}</style></head><body><div class="container"><h1>🙏 Prayer Jar Admin</h1><button class="refresh" onclick="loadDashboard()">Refresh</button><div class="stats"><div class="card"><div id="pendingCount">0</div>Pending</div><div class="card"><div id="approvedCount">0</div>Approved</div><div class="card"><div id="rejectedCount">0</div>Rejected</div><div class="card"><div id="totalCount">0</div>Total</div></div><div id="list"></div></div><script>const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_KEY='YOUR_ANON_KEY';const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function loadDashboard(){const {data:all=[]}=await supabaseClient.from('prayers').select('*').order('created_at',{ascending:false});pendingCount.textContent=all.filter(x=>x.status==='pending').length;approvedCount.textContent=all.filter(x=>x.status==='approved').length;rejectedCount.textContent=all.filter(x=>x.status==='rejected').length;totalCount.textContent=all.length;let h='';all.filter(x=>x.status==='pending').forEach(p=>{h+=`<div class="item"><b>Prayer</b><br>${p.prayer}<br><small>${p.user_id}</small><br><textarea id="r_${p.id}" placeholder="Reason if rejecting"></textarea><br><button class="approve" onclick="approvePrayer('${p.id}')">Approve</button> <button class="reject" onclick="rejectPrayer('${p.id}')">Reject</button></div>`});list.innerHTML=h||'<p>No pending prayers.</p>';}async function approvePrayer(id){await supabaseClient.from('prayers').update({status:'approved'}).eq('id',id);loadDashboard();}async function rejectPrayer(id){const reason=document.getElementById('r_'+id).value.trim();if(!reason){alert('Enter rejection reason');return;}await supabaseClient.from('prayers').update({status:'rejected',reject_reason:reason}).eq('id',id);loadDashboard();}loadDashboard();</script></body></html>
