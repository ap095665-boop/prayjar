<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prayer Jar Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:radial-gradient(circle at top,#350000,#000 70%);color:#fff}
.page{max-width:430px;margin:auto;min-height:100vh;padding:28px 18px 120px;display:flex;flex-direction:column;align-items:center;gap:22px}
#morph{height:72px;font-size:34px;font-weight:800;color:#ffd54f;display:flex;align-items:center;justify-content:center;text-align:center;transition:all .7s ease;filter:blur(0);opacity:1}
.morphOut{opacity:0;filter:blur(12px);transform:scale(.92)}
.morphIn{opacity:1;filter:blur(0);transform:scale(1)}
.jar{position:relative}
.glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;
background:radial-gradient(circle,#ffc107,#ff5a00 45%,transparent 75%);filter:blur(12px)}
video{position:relative;width:145px;border-radius:16px;display:block;cursor:pointer}
#remaining{color:#ffd54f;font-size:18px}
.submit{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#d4af37;color:#000;padding:14px 24px;border-radius:28px;font-weight:bold;cursor:pointer;z-index:20}
.buttonRow{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;display:flex;gap:12px;width:min(92%,380px);z-index:20}
.buttonRow .submit{position:static;transform:none;left:auto;flex:1;text-align:center}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#171717ee;border:1px solid #d4af37;border-radius:28px;padding:12px 18px;white-space:nowrap}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);justify-content:center;align-items:center;z-index:100}
.card{background:#111;width:90%;max-width:360px;border-radius:18px;padding:20px}
textarea{width:100%;height:90px;margin:12px 0;background:#222;color:#fff}
.actions{display:flex;gap:10px}.actions button{flex:1;padding:12px}
</style></head><body>
<div class="page">
<div id="morph">WELCOME TO PRAYER JAR</div>
<div class="jar"><div class="glow"></div>
<video id="jarVideo"
playsinline
preload="auto"
disablepictureinpicture
controlslist="nodownload noplaybackrate noremoteplayback"
oncontextmenu="return false;"
draggable="false"
style="-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;">
<source src="https://ap095665-boop.github.io/Trial/video-background-remover.webm" type="video/webm">
</video>
</div>
<div id="remaining">🫙 Touch the jar to open prayer request</div>
</div>
<div class="buttonRow"><div class="submit" id="streakBtn">🔥 Streaks</div><div class="submit" id="submitBtn">➕ Submit Prayer</div></div>
<div class="tabs">
<span id="donateTab">❤️ Donate</span>
&nbsp;&nbsp;
<span id="testimonyTab">📖 Testimony</span>
&nbsp;&nbsp;
<span id="requestTab" style="cursor:pointer;">📨 Your Request</span>
</div>
<div class="overlay" id="pray"><div class="card"><h2>🙏 Prayer Request</h2><div style="max-height:220px;overflow-y:auto;margin:12px 0;padding-right:6px;"><p id="prayerText">Please pray for someone in need.</p></div><div class="actions"><button onclick="skipPrayer()">Skip</button>

<button onclick="prayDone()">🙏 I Prayed</button></div></div></div>
<div class="overlay" id="submit"><div class="card"><h2>Submit Prayer</h2><textarea placeholder="Your prayer..."></textarea><div class="actions"><button onclick="submit.style.display='none'">Cancel</button><button onclick="submitPrayer()">Submit</button></div></div></div>
<div class="overlay" id="thanks"><div class="card"><h2>🙏 Thank You</h2><p>You completed today's 10 prayers. Come back tomorrow.</p><button onclick="thanks.style.display='none'">Close</button></div></div>
    <div class="overlay" id="myRequests">

<div class="card">

<h2>📨 My Prayer Requests</h2>

<div id="requestList"
style="
max-height:320px;
overflow:auto;
margin-top:12px;">
</div>

<button onclick="myRequests.style.display='none'">
Close
</button>

</div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
//==============================
// SUPABASE PART 1
//==============================

// Your Supabase Project
const SUPABASE_URL = "https://bslelkeatmwdmfmoockm.supabase.co";
const SUPABASE_KEY = "sb_publishable_smuHDWh9DN8RHd-mBwsWGQ_0fVcBi3Q";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// Prayer Jar localStorage key
const STORAGE_KEY = "prayerjar_user_id";

// Get existing Prayer Jar user
let userId = localStorage.getItem(STORAGE_KEY);

// Create one if not found
if (!userId) {
    userId = crypto.randomUUID();
    localStorage.setItem(STORAGE_KEY, userId);
    console.log("🆕 New Prayer Jar User:", userId);
} else {
    console.log("✅ Existing Prayer Jar User:", userId);
}

window.userId = userId;

// Register user in Supabase
async function registerUser() {

    const { data, error } = await supabaseClient
        .from("profile1")
        .select("user_id")
        .eq("user_id", userId)
        .maybeSingle();

    if (error) {
        console.error("Select Error:", error);
        return;
    }

    if (!data) {

        const { error: insertError } = await supabaseClient
            .from("profile1")
            .insert([
                {
                    user_id: userId
                }
            ]);

        if (insertError) {
            console.error("Insert Error:", insertError);
        } else {
            console.log("✅ New User Registered");
        }

    } else {

        console.log("✅ Existing User Found");

    }

}

registerUser();

//==============================
// END PART 1
//==============================
//==============================
// PART 2 - SUBMIT PRAYER
//==============================

async function submitPrayer() {

    const textarea = document.querySelector("#submit textarea");

    const prayer = textarea.value.trim();

    if (!prayer) {
        alert("Please enter a prayer.");
        return;
    }

    const { error } = await supabaseClient
        .from("prayers")
        .insert([
            {
                user_id: userId,
                prayer: prayer,
                status: "pending"
            }
        ]);

    if (error) {
        alert("Error: " + error.message);
        return;
    }

    textarea.value = "";

    submit.style.display = "none";

    alert("🙏 Prayer submitted successfully.\nWaiting for approval.");

}
    async function loadMyRequests(){

const { data,error } =
await supabaseClient
.from("prayers")
.select("*")
.eq("user_id",userId)
.order("created_at",{ascending:false});

if(error){
alert(error.message);
return;
}

let html="";

if(data.length===0){

html="<p>No prayer requests yet.</p>";

}else{

data.forEach(p=>{

let color="gold";
let status="🟡 Pending";

if(p.status==="approved"){
status="🟢 Approved";
color="#2ecc71";
}

if(p.status==="rejected"){
status="🔴 Rejected";
color="#ff4444";
}

html+=`

<div style="
padding:12px;
margin-bottom:12px;
background:#1b1b1b;
border-radius:12px;">

<div style="color:${color};
font-weight:bold;">
${status}
</div>

<p style="margin:8px 0;">
${p.prayer}
</p>

${p.reject_reason
?`<small>
Reason:
${p.reject_reason}
</small>`:""}

</div>

`;

});

}

requestList.innerHTML=html;

myRequests.style.display="flex";

    }
//==============================
// SKIP PRAYER
//==============================

async function skipPrayer(){

    await supabaseClient
    .from("prayer_actions")
    .insert([{

        user_id:userId,

        prayer_id:currentPrayer.id,

        action:"skipped"

    }]);

    pray.style.display="none";

}

 //==============================
// I PRAYED
//==============================

async function prayDone(){

    // Save prayer action
    await supabaseClient
    .from("prayer_actions")
    .insert([{
        user_id:userId,
        prayer_id:currentPrayer.id,
        action:"prayed"
    }]);

    // Increase prayer count
    await supabaseClient.rpc(
        "increment_prayed_count",
        {
            prayer_id_input:currentPrayer.id
        }
    );

    // Get current profile
    const { data } = await supabaseClient
    .from("profile1")
    .select("prayed_count")
    .eq("user_id",userId)
    .single();

    // Update prayed count
    await supabaseClient
    .from("profile1")
    .update({
        prayed_count:(data.prayed_count || 0)+1
    })
    .eq("user_id",userId);

    pray.style.display="none";

}
const msgs=["WELCOME TO PRAYER JAR","YOU PRAY FOR OTHERS","OTHERS WILL PRAY FOR YOU"];
let idx=0;
setInterval(()=>{
 const e=document.getElementById("morph");
 e.className="morphOut";
 setTimeout(()=>{
   idx=(idx+1)%msgs.length;
   e.textContent=msgs[idx];
   e.className="morphIn";
 },450);
},3000);


jarVideo.onclick=()=>{jarVideo.currentTime=0;jarVideo.play();};
jarVideo.addEventListener("contextmenu",e=>e.preventDefault());

       
jarVideo.onended = async () => {

    // Get all approved prayers except the user's own
    const { data: prayers, error } = await supabaseClient
        .from("prayers")
        .select("*")
        .eq("status", "approved")
        .neq("user_id", userId);

    if (error) {
        alert(error.message);
        return;
    }

    if (!prayers || prayers.length === 0) {
        alert("🙏 No prayer requests available.");
        return;
    }

    // Get prayers already skipped or prayed
    const { data: actions, error: actionError } = await supabaseClient
    .from("prayer_actions")
    .select("prayer_id")
    .eq("user_id", userId);

if (actionError) {
    alert(actionError.message);
    return;
}

    const viewed = actions
        ? actions.map(a => a.prayer_id)
        : [];

    // Remove already viewed prayers
    const available = prayers.filter(
        p => !viewed.includes(p.id)
    );

    if (available.length === 0) {
        alert("🎉 You have prayed for all available prayer requests.");
        return;
    }

    const randomPrayer =
        available[Math.floor(Math.random() * available.length)];

    window.currentPrayer = randomPrayer;

    prayerText.textContent = randomPrayer.prayer;

    pray.style.display = "flex";
};
function done(){pray.style.display="none";}
submitBtn.onclick = () => {
    submit.style.display = "flex";
};
    requestTab.onclick=loadMyRequests;
</script>
</body></html>
